<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Image Compressor - DevKit</title><meta name="description" content="在线图片压缩工具 - 压缩PNG/JPEG/WebP，调整质量和尺寸，本地处理"><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;flex-direction:column}
header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:700;color:#58a6ff}.logo span{color:#f0c040}
header .badge{font-size:10px;background:#daa520;color:#fff;padding:2px 8px;border-radius:10px;margin-left:8px}
main{max-width:700px;margin:0 auto;padding:32px 24px;flex:1}
.tool-wrapper{padding:20px 0}
footer{padding:16px 24px;border-top:1px solid #21262d;text-align:center;font-size:12px;color:#484f58}
footer a{color:#58a6ff;text-decoration:none;margin:0 8px}
.btn-primary:hover{background:#2ea043!important}.btn:hover{background:#30363d!important}
input:focus,textarea:focus,select:focus{outline:none;border-color:#58a6ff!important}
.btn{font-family:inherit}</style></head><body><header><div class="logo">🛠 <span>Dev</span>Kit<span class="badge">BETA</span></div><div style="font-size:11px;color:#8b949e">🔒 本地处理 · 数据不上传</div></header><main><h1 style="font-size:24px;margin-bottom:4px">Image Compressor</h1><p style="color:#8b949e;font-size:14px;margin-bottom:8px">在线图片压缩工具 - 压缩PNG/JPEG/WebP，调整质量和尺寸，本地处理</p><div class="tool-wrapper"><div id="drop-zone" style="border:2px dashed #30363d;border-radius:12px;padding:48px;text-align:center;cursor:pointer;transition:border-color 0.2s;margin-bottom:16px" onclick="document.getElementById('img-file').click()"><div style="font-size:48px;margin-bottom:12px">🖼</div><div style="font-size:16px;font-weight:600;margin-bottom:4px">点击或拖拽图片到这里</div><div style="font-size:12px;color:#8b949e">支持 PNG / JPEG / WebP</div><input type="file" id="img-file" accept="image/*" style="display:none" onchange="loadImage(this.files[0])"></div><div id="img-controls" style="display:none"><div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px"><div style="flex:1;min-width:150px"><label style="font-size:12px;color:#8b949e;display:block;margin-bottom:4px">质量</label><input type="range" id="img-quality" min="10" max="100" value="80" style="width:100%" oninput="document.getElementById('qual-val').textContent=this.value+'%'"><span id="qual-val" style="font-size:12px;color:#58a6ff">80%</span></div><div style="flex:1;min-width:150px"><label style="font-size:12px;color:#8b949e;display:block;margin-bottom:4px">缩放</label><input type="range" id="img-scale" min="10" max="200" value="100" style="width:100%" oninput="document.getElementById('scale-val').textContent=this.value+'%'"><span id="scale-val" style="font-size:12px;color:#58a6ff">100%</span></div><div><label style="font-size:12px;color:#8b949e;display:block;margin-bottom:4px">格式</label><select id="img-format" style="padding:10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div></div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px"><button class="btn btn-primary" style="padding:10px 24px;background:#238636;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600" onclick="compressImage()">🗜 压缩图片</button><div style="font-size:12px;color:#8b949e;align-self:center"><span id="orig-size"></span> → <span id="comp-size" style="color:#3fb950"></span> <span id="saved" style="color:#f0c040"></span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div style="font-size:11px;color:#8b949e;margin-bottom:4px">原图</div><img id="img-preview" style="max-width:100%;max-height:300px;border-radius:8px;border:1px solid #30363d"></div><div><div style="font-size:11px;color:#8b949e;margin-bottom:4px">压缩后</div><canvas id="img-canvas" style="max-width:100%;max-height:300px;border-radius:8px;border:1px solid #30363d"></canvas></div></div><div style="margin-top:12px"><button class="btn" style="padding:10px 20px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:8px;cursor:pointer;font-size:13px" onclick="downloadImage()">💾 下载压缩图片</button></div></div></div></main><footer><a href="https://github.com/479464887-rgb/image-compress">GitHub</a><span>·</span><span>© 2026 DevKit</span></footer><script>let origImg=null,compBlob=null;
document.getElementById('drop-zone').addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.style.borderColor='#58a6ff'});
document.getElementById('drop-zone').addEventListener('dragleave',e=>{e.currentTarget.style.borderColor='#30363d'});
document.getElementById('drop-zone').addEventListener('drop',e=>{e.preventDefault();e.currentTarget.style.borderColor='#30363d';loadImage(e.dataTransfer.files[0])});
function loadImage(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=function(e){origImg=new Image();origImg.onload=function(){document.getElementById('img-controls').style.display='block';document.getElementById('drop-zone').style.padding='16px';document.getElementById('drop-zone').innerHTML='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:24px">🖼</span><span>'+file.name+' ('+formatSize(file.size)+')</span></div>';document.getElementById('img-preview').src=e.target.result;document.getElementById('orig-size').textContent=formatSize(file.size);compressImage()};origImg.src=e.target.result};reader.readAsDataURL(file)}
function compressImage(){if(!origImg)return;const quality=parseInt(document.getElementById('img-quality').value)/100;const scale=parseInt(document.getElementById('img-scale').value)/100;const format=document.getElementById('img-format').value;const canvas=document.getElementById('img-canvas');const ctx=canvas.getContext('2d');canvas.width=origImg.width*scale;canvas.height=origImg.height*scale;ctx.drawImage(origImg,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{compBlob=blob;document.getElementById('comp-size').textContent=formatSize(blob.size);const saved=((1-blob.size/(origImg.src.length*0.75))*100).toFixed(1);document.getElementById('saved').textContent=saved>0?'(-'+saved+'%)':''},format,quality)}
function downloadImage(){if(!compBlob)return;const url=URL.createObjectURL(compBlob);const a=document.createElement('a');a.href=url;a.download='compressed.'+document.getElementById('img-format').value.split('/')[1];a.click();URL.revokeObjectURL(url)}
function formatSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}
</script></body></html>
